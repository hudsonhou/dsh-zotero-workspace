name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check index.js
          node --check client.js
          node --check lib/core.js
          node --check lib/handler.js
      - name: Offline client tests
        run: |
          node test/client-wiring.mjs
          node test/client-render.mjs
      - name: Package contents
        run: npm pack --dry-run
