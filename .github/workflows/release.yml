name: release

# A pushed version tag creates the GitHub Release with generated notes. The
# package is installed straight from the tag by the DSH plugin manager, so the
# tag itself is the artifact — no npm publish step.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: |
          node --check index.js
          node --check client.js
          node --check lib/core.js
          node --check lib/handler.js
      - name: Offline client tests
        run: |
          node test/client-wiring.mjs
          node test/client-render.mjs
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
